name: Publish daily UPSC blog

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate daily posts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
        run: node scripts/daily-blog.js
      - name: Build site and refresh sitemap
        run: npm run build
      - name: Commit and push generated content when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public
          content_changes="$(git diff --cached --name-only -- public/posts.json public/feed.xml public/blog)"
          if [ -z "$content_changes" ]; then
            echo "No daily blog changes to commit."
            exit 0
          fi
          git commit -m "chore: publish daily UPSC blog posts"
          git push
